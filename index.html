<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 梦幻爱心 ✨</title>
</head>
<style>
  /* --- CSS 变量，方便统一修改主题 --- */
  :root {
    --bg-color-start: #0a001a;
    --bg-color-end: #000;
    --primary-color: #ff1493; /* 深粉色 */
    --secondary-color: #ff69b4; /* 亮粉色 */
    --tertiary-color: #ffc0cb; /* 浅粉色 */
    --glow-color: rgba(255, 20, 147, 0.7);
    --star-color: #ffffff;
  }
  
  html,
  body {
    height: 100%;
    padding: 0;
    margin: 0;
    /* 升级：动态渐变背景，模拟星云流动 */
    background: linear-gradient(135deg, var(--bg-color-start), var(--bg-color-end), #1a0033, var(--bg-color-start));
    background-size: 400% 400%;
    animation: backgroundFlow 20s ease infinite;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    cursor: none; /* 隐藏默认光标，使用自定义辉光 */
  }

  @keyframes backgroundFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 新增：光标跟随辉光效果 */
  .cursor-glow {
    position: fixed;
    left: 0;
    top: 0;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 105, 180, 0.15) 0%, transparent 60%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 999;
    transition: transform 0.1s ease-out;
  }

  /* 背景星空效果 (保留并优化) */
  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .star {
    position: absolute;
    background: var(--star-color);
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
    will-change: opacity, transform;
  }

  /* 新增：流星效果 */
  .shooting-star {
    position: absolute;
    width: 2px;
    height: 80px;
    background: linear-gradient(to top, transparent, var(--star-color));
    border-radius: 50%;
    filter: drop-shadow(0 0 6px var(--star-color));
    animation: fall linear infinite;
    will-change: transform;
  }

  @keyframes fall {
    from { transform: translate3d(-100px, -100px, 0) rotate(45deg); opacity: 1; }
    to { transform: translate3d(calc(100vw + 100px), calc(100vh + 100px), 0) rotate(45deg); opacity: 0; }
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  /* 主容器 */
  .container {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    /* 新增：为3D效果开启透视 */
    perspective: 1000px;
  }

  /* 爱心图片容器 */
  .heart-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 4s ease-in-out infinite;
    /* 新增：应用3D变换 */
    transform-style: preserve-3d;
    transition: transform 0.2s ease-out;
    will-change: transform;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) scale(1) rotateZ(0deg); }
    50% { transform: translateY(-25px) scale(1.05) rotateZ(2deg); }
  }

  img {
    display: block;
    border-radius: 20px;
    box-shadow: 
      0 0 50px var(--glow-color),
      0 0 100px var(--glow-color),
      0 0 150px var(--glow-color);
    animation: glow 2.5s ease-in-out infinite alternate;
    will-change: box-shadow;
  }

  @keyframes glow {
    from { 
      box-shadow: 
        0 0 50px var(--glow-color),
        0 0 100px rgba(255, 20, 147, 0.4),
        0 0 150px rgba(255, 20, 147, 0.2);
    }
    to { 
      box-shadow: 
        0 0 70px var(--glow-color),
        0 0 120px rgba(255, 20, 147, 0.6),
        0 0 200px rgba(255, 20, 147, 0.4);
    }
  }

  /* 环绕粒子效果 (优化) */
  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--tertiary-color));
    border-radius: 50%;
    animation: orbit 10s linear infinite;
    box-shadow: 0 0 10px currentColor;
    will-change: transform, opacity, filter;
  }

  @keyframes orbit {
    0% { 
      transform: rotate(0deg) translateX(350px) rotate(0deg) scale(0.5);
      opacity: 0.5;
      filter: hue-rotate(0deg);
    }
    50% { 
      transform: rotate(180deg) translateX(400px) rotate(-180deg) scale(1.2);
      opacity: 1;
      filter: hue-rotate(180deg);
    }
    100% { 
      transform: rotate(360deg) translateX(350px) rotate(-360deg) scale(0.5);
      opacity: 0.5;
      filter: hue-rotate(360deg);
    }
  }

  /* 标题文字 */
  .title {
    position: absolute;
    top: 10%;
    color: transparent;
    background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--tertiary-color), var(--primary-color));
    background-size: 400% 400%;
    -webkit-background-clip: text;
    background-clip: text;
    font-size: 3rem;
    font-weight: bold;
    text-align: center;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
    animation: rainbow 4s ease-in-out infinite, pulse 2.5s ease-in-out infinite;
    will-change: transform, background-position;
  }
  
  @keyframes rainbow {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* 底部签名 */
  .signature {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--secondary-color);
    font-size: 1.2rem;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    animation: signatureGlow 2.5s ease-in-out infinite alternate;
    z-index: 10;
  }

  @keyframes signatureGlow {
    from { 
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
    }
    to { 
      text-shadow: 0 0 20px var(--secondary-color), 0 0 30px var(--primary-color);
    }
  }

  /* 响应式设计 */
  @media (max-width: 768px) {
    img {
      width: 90vw !important;
      height: auto !important;
    }
    .title { font-size: 2rem; }
    .signature { font-size: 1rem; bottom: 20px; }
    .cursor-glow { display: none; } /* 移动端隐藏辉光 */
    body { cursor: default; } /* 恢复默认光标 */
  }
</style>
<body>
  <!-- 新增：光标辉光 -->
  <div class="cursor-glow"></div>

  <!-- 星空背景 (将流星也放在这里) -->
  <div class="stars" id="stars"></div>

  <!-- 主容器 -->
  <div class="container">
    <!-- 标题 -->
    <div class="title">✨ 希望谭雅匀每天都开心 ✨</div>
    
    <!-- 爱心容器 -->
    <div class="heart-container" id="heartContainer">
      <!-- 环绕粒子 -->
      <div class="particles" id="particles"></div>
      
      <!-- 爱心图片 -->
      <img src="https://pic.imgdb.cn/item/642547f5a682492fcc15cd5d.gif" width="700" height="400" alt="粒子爱心动画" />
    </div>
  </div>

  <!-- 底部签名 -->
  <div class="signature">💖 Created by lsj with Love 💖</div>

  <script>
    const starsContainer = document.getElementById('stars');
    const particlesContainer = document.getElementById('particles');
    const heartContainer = document.getElementById('heartContainer');
    const cursorGlow = document.querySelector('.cursor-glow');

    // 1. 创建星空和流星
    function createCosmos() {
      // 创建静态星星
      for (let i = 0; i < 150; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        const size = Math.random() * 2 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.animationDelay = `${Math.random() * 2}s`;
        starsContainer.appendChild(star);
      }

      // 创建流星
      for (let i = 0; i < 3; i++) {
        const shootingStar = document.createElement('div');
        shootingStar.className = 'shooting-star';
        shootingStar.style.top = `${Math.random() * 50 - 25}%`; // -25% to 25%
        shootingStar.style.left = `${Math.random() * 100}%`;
        const duration = Math.random() * 3 + 2; // 2-5 seconds
        shootingStar.style.animationDuration = `${duration}s`;
        shootingStar.style.animationDelay = `${Math.random() * 5}s`; // Stagger their appearance
        starsContainer.appendChild(shootingStar);
      }
    }

    // 2. 创建环绕粒子 (简化并保留核心)
    function createOrbitingParticles() {
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.animationDelay = `${i * 0.5}s`;
        particle.style.animationDuration = `${10 + Math.random() * 5}s`;
        particlesContainer.appendChild(particle);
      }
    }

    // 3. 鼠标移动交互：3D倾斜和辉光跟随
    document.addEventListener('mousemove', (e) => {
      // 辉光跟随
      cursorGlow.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;

      // 3D倾斜效果
      const { clientX, clientY } = e;
      const { innerWidth, innerHeight } = window;
      const rotateX = (clientY / innerHeight - 0.5) * -30; // 调整 -30 来控制倾斜幅度
      const rotateY = (clientX / innerWidth - 0.5) * 30; // 调整 30 来控制倾斜幅度
      
      heartContainer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
    
    // 鼠标移出窗口时重置倾斜
    document.addEventListener('mouseleave', () => {
        heartContainer.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });


    // 4. 点击绽放爱心效果
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 15; i++) {
        createHeartParticle(e.clientX, e.clientY);
      }
    });

    function createHeartParticle(x, y) {
      const heart = document.createElement('div');
      heart.style.position = 'fixed';
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      heart.style.width = '10px';
      heart.style.height = '10px';
      heart.style.background = `hsl(${Math.random() * 60 + 300}, 100%, 70%)`; // 粉色到紫色系
      heart.style.zIndex = '1000';
      heart.style.pointerEvents = 'none';

      heart.style.clipPath = 'path("M0 200 v-200 h200 a100 100 90 0 1 0 200 a100 100 90 0 1 -200 0 z")';
      
      document.body.appendChild(heart);
      
      const angle = Math.random() * Math.PI * 2;
      const velocity = 50 + Math.random() * 150;
      const vx = Math.cos(angle) * velocity;
      const vy = Math.sin(angle) * velocity;

      heart.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(calc(${vx}px - 50%), calc(${vy}px - 50%)) scale(0)`, opacity: 0 }
      ], {
        duration: 1200,
        easing: 'ease-out'
      }).onfinish = () => {
        heart.remove();
      };
    }

    // 初始化所有效果
    document.addEventListener('DOMContentLoaded', () => {
      createCosmos();
      createOrbitingParticles();
      // 把你原有的其他粒子创建函数也放在这里
      // createHeartParticles(); 
      // createSpiralParticles();
      // ...
    });
  </script>
</body>
</html>
